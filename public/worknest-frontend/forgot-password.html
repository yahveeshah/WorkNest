<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkNest - Reset Password</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #341539 0%, #200C24 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(209, 176, 193, 0.3);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; background-color: rgba(52,21,57,0.1); color: var(--dark-purple); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; margin: 0 auto 1rem;">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 style="color: var(--dark-purple); font-size: 1.5rem;">Reset Password</h1>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.375rem;">
        Enter your work email address and we'll send you instructions to reset your account password.
      </p>
    </div>

    <form id="resetForm" data-validate>
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="resetEmail">Work Email Address</label>
        <input type="email" id="resetEmail" class="form-control" placeholder="name@company.com" required>
      </div>

      <button type="submit" class="btn btn--primary btn--lg" style="width: 100%;">
        Send Reset Link <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="index.html" style="font-size: 0.875rem; font-weight: 600; color: var(--dark-purple);">
        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
      </a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Password reset link sent to your inbox!', 'success');
    });
  </script>
</body>
</html>
